<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Marcellus&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin:0; }
    @font-face { font-family:'_pre'; src:local('Georgia'); }
  </style>
</helmet>

<div style="position:relative; width:1520px; height:998px; overflow:hidden; background:#cfc7ba url('ativos/mockup-sousplat.jpg') center/cover no-repeat; font-family:'Cormorant Garamond',serif;">

  <!-- vinheta suave para destacar o convite -->
  <div style="position:absolute; inset:0; background:radial-gradient(60% 60% at 40% 50%, rgba(0,0,0,0) 40%, rgba(40,32,24,.16) 100%); pointer-events:none;"></div>

  <!-- CONVITE aplicado sobre o sousplat -->
  <div style="position:absolute; left:40.5%; top:50%; transform:translate(-50%,-50%) rotate(-3.6deg); width:384px; border-radius:2px; z-index:3; box-shadow:13px 28px 44px -16px rgba(35,26,18,.52), 3px 7px 15px rgba(35,26,18,.30), 0 1px 0 rgba(255,255,255,.4);">
    <div style="position:relative; overflow:hidden; background:#FBF7F1; padding:46px 40px 40px; display:flex; flex-direction:column; align-items:center; text-align:center; border-radius:2px;">

      <!-- selo: monograma escolhido + data -->
      <div style="width:78px; height:78px; display:flex; align-items:center; justify-content:center;">{{ monoEl }}</div>
      <div style="font-family:'Marcellus',serif; font-size:9.5px; letter-spacing:.42em; color:{{ ink60 }}; padding-left:.42em; margin-top:8px;">01 · 08 · 2027</div>

      <!-- nomes (tipografia escolhida) -->
      <div style="font-family:{{ nameCss }}; font-weight:{{ nameWeight }}; text-transform:{{ nameCase }}; font-size:21px; letter-spacing:.12em; color:{{ ink }}; margin-top:30px; line-height:1.15;">Alexandre&nbsp;&amp;&nbsp;Mayara</div>

      <div style="width:54px; height:1px; background:{{ hair }}; margin:20px 0;"></div>

      <!-- título -->
      <div style="font-family:'Cormorant Garamond',serif; font-weight:500; font-size:46px; letter-spacing:.16em; color:{{ ink }}; padding-left:.16em; line-height:1;">TARDE</div>
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; font-size:38px; color:{{ accent }}; line-height:1.05; margin-top:2px;">Italiana</div>

      <!-- chamada -->
      <div style="font-family:'Marcellus',serif; font-size:18px; letter-spacing:.26em; color:{{ ink }}; padding-left:.26em; margin-top:26px;">365 DIAS</div>
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:17px; color:{{ ink60 }}; margin-top:5px; white-space:nowrap;">para o nosso grande dia</div>

      <div style="width:54px; height:1px; background:{{ hair }}; margin:24px 0 18px;"></div>

      <div style="font-family:'Marcellus',serif; font-size:15px; letter-spacing:.3em; color:{{ ink }}; padding-left:.3em;">01 · 08 · 2027</div>
      <div style="font-family:'Montserrat',sans-serif; font-weight:400; font-size:8px; letter-spacing:.24em; text-transform:uppercase; color:{{ ink60 }}; margin-top:10px;">convite físico e digital</div>

      <!-- realismo: luz direcional + realce + assentamento (mescla com a cena) -->
      <div style="position:absolute; inset:0; pointer-events:none; background:linear-gradient(135deg, rgba(255,250,242,.5) 0%, rgba(255,250,242,0) 36%, rgba(58,44,30,.13) 100%); mix-blend-mode:multiply;"></div>
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(130% 85% at 26% 20%, rgba(255,253,247,.34), rgba(255,253,247,0) 56%); mix-blend-mode:screen;"></div>
      <div style="position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 34px rgba(58,44,30,.11), inset 0 0 2px rgba(58,44,30,.2);"></div>
    </div>
  </div>

  <!-- etiqueta de contexto -->
  <div style="position:absolute; left:28px; bottom:24px; font-family:'Montserrat',sans-serif; font-weight:500; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5);">Convite · Tarde Italiana · aplicação no mockup</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1520,&quot;height&quot;:998}}">
class Component extends DCLogic {
  state = { choiceSvg: '', letChoice: null };

  async componentDidMount() {
    this.refresh();
    // fallback: monograma só-letras do repo, caso nada tenha sido escolhido
    try {
      const r = await fetch('am/mono-letras.svg');
      let t = await r.text();
      t = t.replace('viewBox="0 0 1000 1000">',
        'viewBox="0 0 1000 1000" class="am-mono-cv" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;overflow:visible"><style>.am-mono-cv .cls-1{fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}</style>');
      this._fallback = t;
      this.forceUpdate();
    } catch (e) {}
    this._onCh = () => this.refresh();
    window.addEventListener('am-mono-choice', this._onCh);
    window.addEventListener('am-lettering-choice', this._onCh);
  }
  componentWillUnmount() {
    if (this._onCh) {
      window.removeEventListener('am-mono-choice', this._onCh);
      window.removeEventListener('am-lettering-choice', this._onCh);
    }
  }
  refresh() {
    let svg = '', lc = null;
    try { svg = localStorage.getItem('am_mono_choice_svg') || ''; } catch (e) {}
    try { const l = localStorage.getItem('am_lettering_choice'); lc = l ? JSON.parse(l) : null; } catch (e) {}
    this.setState({ choiceSvg: svg, letChoice: lc });
  }

  renderVals() {
    const ink = '#34302a', ink60 = '#8a7f70', accent = '#C0613F', hair = '#d8ccba';
    const lc = this.state.letChoice || { css: "'Cormorant Garamond',serif", weight: 500, caseT: 'none' };
    const html = this.state.choiceSvg || this._fallback || '';
    const monoEl = html
      ? React.createElement('div', { style: { width: '100%', height: '100%', color: ink }, dangerouslySetInnerHTML: { __html: html } })
      : null;
    return {
      monoEl,
      nameCss: lc.css, nameWeight: lc.weight, nameCase: lc.caseT,
      ink, ink60, accent, hair
    };
  }
}
</script>
</body>
</html>
